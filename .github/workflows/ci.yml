name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  linux:
    name: linux (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      # whisper sessions are not concurrency-safe in-process (concurrent init
      # corrupts the heap; reproduced in CI as SIGABRT "double free or
      # corruption (out)"). Serialize the whole test run — the app itself
      # keeps one session at a time.
      RUST_TEST_THREADS: "1"
      # SIGILL mitigation (4-of-6 runs red at the scripted smoke before this):
      # the intermittent "Illegal instruction (exit 132)" right after wgpu
      # surface configuration is the runner-host CPU-variance class — the
      # software rasterizer's runtime JIT can emit vectors some hosts don't
      # execute (mesa bz 108135 lineage; the same intermittent-SIGILL class as
      # llama.cpp#25275 on ubuntu runners). Pinning llvmpipe/lavapipe to
      # 128-bit vectors is the documented knob; benign for non-mesa steps.
      LP_NATIVE_VECTOR_WIDTH: "128"
      # SIGILL root cause (gdb backtrace, run 39206922904): the crash was NOT
      # mesa — it was ggml's own CPU backend init (`whisper_model_load →
      # ggml_backend_cpu_device_get_extra_buffers_type`) executing instructions
      # the runner host lacked. whisper.cpp is built by cmake-rs, and
      # GGML_NATIVE defaults ON → `-march=native`. With Swatinem/rust-cache
      # reusing `target/` across DIFFERENT runner hosts, an object built on an
      # AVX-512 host then runs on an AVX2-only host → SIGILL, intermittently,
      # for byte-identical code. Fix: build a portable baseline (ggml's own
      # runtime CPU dispatch handles the rest) and invalidate the poisoned
      # cache below.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (cmake for whisper.cpp; libasound2 for the capture feature; xvfb + software GL/Vulkan + libxkbcommon-x11 for the UI smoke)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev xvfb libgl1-mesa-dri mesa-vulkan-drivers libxkbcommon-x11-0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Bumped when GGML_NATIVE=OFF landed: the previous cache held objects
          # compiled with `-march=native` on other runner hosts — reusing them
          # was the intermittent SIGILL. Never reuse pre-baseline objects.
          key: ggml-baseline-v1

      - name: Add cross-check targets (pure-Rust glass crate; no Apple/Windows SDK needed for check)
        run: rustup target add aarch64-apple-darwin x86_64-pc-windows-msvc

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (debug profile)
        run: cargo test --workspace

      # M3: the capture feature must compile on Linux (libasound2-dev installed
      # above) and its pure helpers run headless. `capture` stays OFF in every
      # default build, so nothing below changes what ships.
      - name: Capture feature — check + unit tests (ALSA)
        run: |
          cargo check -p suramak-asr --features capture
          cargo test -p suramak-asr --features capture

      - name: Cross-check suramak-glass (aarch64-apple-darwin)
        run: cargo check -p suramak-glass --target aarch64-apple-darwin

      - name: Cross-check suramak-glass (x86_64-pc-windows-msvc)
        run: cargo check -p suramak-glass --target x86_64-pc-windows-msvc

      # M3 (Addendum A): the CoreAudio-tap crate is pure Rust (objc2 + extern "C",
      # system-framework linkage only) — the darwin check runs from Linux, same
      # story as the glass cross-checks. Runtime behavior is macOS CI/user smoke.
      - name: Cross-check suramak-taps (aarch64-apple-darwin)
        run: cargo check -p suramak-taps --target aarch64-apple-darwin

      # M10B: the SpeechTranscriber refusal-stub path. With the feature on but
      # off-macOS the module is an honest stub (the `speech` crate is macOS-only
      # and is never built here) — its tests run on Linux; the real engine is the
      # macos job below / the owner's Mac.
      - name: SpeechTranscriber feature — check + tests (refusal stub, Linux)
        run: |
          cargo check -p suramak-asr --features speech-transcriber
          cargo test -p suramak-asr --features speech-transcriber

      # `cargo check --target aarch64-apple-darwin` is only meaningful for pure-Rust
      # crates: `suramak-asr` pulls C dependencies (ring via rustls, whisper-rs-sys) that
      # need an Apple C toolchain (no osxcross on this runner). The darwin *build* of the
      # asr crate — including the Core ML feature — is verified by the macos job below;
      # here we verify the feature wiring itself, which needs no toolchain.
      - name: Verify Core ML feature wiring (aarch64-apple-darwin feature resolution)
        run: |
          cargo tree -e features -p suramak-asr --target aarch64-apple-darwin | grep -q 'whisper-rs feature "coreml"' && echo "coreml wired for macOS target"
          cargo tree -e features -p suramak-asr --target aarch64-apple-darwin | grep -q 'whisper-rs feature "metal"' && echo "metal wired for macOS target"
          cargo tree -e features -p suramak-asr --features coreml --target aarch64-apple-darwin | grep -q 'whisper-rs-sys feature "coreml"' && echo "coreml passthrough -> whisper-rs-sys"

      - name: UI smoke (xvfb, software Vulkan → GL)
        run: |
          mkdir -p build
          SURAMAK_SMOKE_SECS=3 xvfb-run -a cargo run -p suramak-ui
          test -f build/smoke_ok.txt && echo SMOKE-OK

      - name: Build release CLI
        run: cargo build --release -p suramak-cli

      - name: Restore tiny model cache
        uses: actions/cache@v4
        with:
          # `directories` lowercases the app name on Linux → ~/.local/share/suramak
          path: ~/.local/share/suramak/models
          key: suramak-linux-models-tiny-be07e048e1e5

      - name: Download tiny model (sha256 verified)
        run: ./target/release/suramak-cli models download tiny

      - name: CLI e2e — English fixture
        run: |
          ./target/release/suramak-cli transcribe fixtures/audio/en.wav --model tiny --lang en --formats json,md --out-dir build/out
          python3 -c "import json;d=json.load(open('build/out/en.json'));assert len(d['segments'])>=1;print('en segments',len(d['segments']))"
          grep -qi fox build/out/en.json && echo EN-OK

      - name: CLI e2e — Indonesian fixture
        run: |
          ./target/release/suramak-cli transcribe fixtures/audio/id.wav --model tiny --lang id --formats json --out-dir build/out
          python3 -c "import json;d=json.load(open('build/out/id.json'));assert len(d['segments'])>=1 and d['segments'][0]['text'].strip();print('id segments',len(d['segments']))"

      - name: whisper e2e tests (release, ignored)
        env:
          SURAMAK_REQUIRE_MODEL: "1"
        run: cargo test --workspace --release -- --ignored

      # M2: the scripted in-app job — import → transcribe (resolved default
      # model) → save to the sqlite library → assert the DB row, all inside the
      # real app under xvfb. SURAMAK_SMOKE_SECS is the watchdog (exit 1 + no
      # file when the job has not completed by then).
      - name: UI scripted smoke job (in-app pipeline → sqlite library)
        env:
          # CI-smoke diagnostics (branch ci/smoke-diagnostics): verbose app logs
          # + crash backtraces to pinpoint the SIGILL / hang on the runners.
          RUST_LOG: debug
          RUST_BACKTRACE: "1"
        run: |
          rm -f build/smoke_job_ok.txt
          # Crash forensics: keep a core in the CWD so a SIGILL — if the
          # LP_NATIVE_VECTOR_WIDTH pin proves insufficient — yields a real
          # backtrace instead of another guess.
          sudo sysctl -w kernel.core_pattern=core >/dev/null 2>&1 || true
          ulimit -c unlimited || true
          set +e
          SURAMAK_SMOKE_SECS=120 SURAMAK_SMOKE_JOB=fixtures/audio/en.wav xvfb-run -a cargo run -p suramak-ui
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "smoke app exited rc=$RC — crash forensics follow"
            sudo apt-get install -y gdb >/dev/null 2>&1 || true
            CORE=$(ls -t core* 2>/dev/null | head -1 || true)
            if [ -n "$CORE" ]; then
              gdb -batch -ex "bt 40" ./target/debug/suramak "$CORE" 2>&1 | tail -70 || true
            else
              echo "no core file found"
            fi
          fi
          test "$RC" -eq 0
          test -f build/smoke_job_ok.txt && echo SMOKE-JOB-OK
          ./target/release/suramak-cli library list
          ./target/release/suramak-cli library list | grep -q "en.wav" && echo LIBRARY-OK

  macos:
    name: macos (macos-26)
    runs-on: macos-26
    env:
      # same in-process whisper-session constraint as the linux job
      RUST_TEST_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build workspace (release, Metal)
        run: cargo build --release --workspace

      # M10B: compile the `speech-transcriber` feature on a real Mac — the
      # `speech` crate's Swift bridge (`swift build` via its build.rs) is the one
      # piece Linux cannot compile. Bounded: one debug build of the asr crate.
      - name: Build suramak-asr with the SpeechTranscriber feature (Swift bridge)
        run: cargo build -p suramak-asr --features speech-transcriber

      - name: Restore tiny model cache
        uses: actions/cache@v4
        with:
          # macOS ProjectDirs project path is the reverse-DNS bundle id
          path: ~/Library/Application Support/dev.suramak.Suramak/models
          key: suramak-macos-models-tiny-be07e048e1e5

      - name: Download tiny model (sha256 verified)
        run: ./target/release/suramak-cli models download tiny

      - name: Download tiny Core ML encoder package (sha256 verified, extracted)
        run: ./target/release/suramak-cli models download tiny --encoder

      - name: doctor (engine stack + encoder pairing)
        run: ./target/release/suramak-cli doctor

      - name: whisper e2e tests (release, ignored) — incl. Core ML/ANE engagement
        env:
          SURAMAK_REQUIRE_MODEL: "1"
          SURAMAK_REQUIRE_COREML: "1"
        run: cargo test --workspace --release -- --ignored

      # M3: device enumeration only — CI runners have no microphone, so the test
      # asserts a list (possibly empty) and opens no stream. `capture-test`
      # implies `capture`; the real recording E2E is the user smoke on the Mac.
      - name: Capture device enumeration (capture-test, no stream)
        run: cargo test -p suramak-asr --features capture,capture-test

      - name: Build UI (release)
        run: cargo build --release -p suramak-ui

      # M12: fetch the pinned Sparkle distribution and build the bundle with
      # the `updates` feature — the CI smoke below then launches the real
      # bundle, which proves the embedded framework resolves at runtime (the
      # rpath) and that the updater starts inside an app bundle. Bounded: one
      # sha256-verified download, already cached across steps.
      - name: Fetch the pinned Sparkle distribution (framework + tools)
        run: ./scripts/fetch-sparkle.sh

      - name: Package dist/Suramak.app (ad-hoc codesign; embeds Sparkle)
        env:
          # Feature parity with release.yml on purpose: the release ships with
          # `speech-transcriber`, which links a Swift bridge. Building the CI
          # bundle WITHOUT it hid a launch-blocking dyld failure in v0.3.0
          # (@rpath/libswift_Concurrency.dylib). The bundle the smoke launches
          # must be the bundle that ships.
          SURAMAK_FEATURES: speech-transcriber,updates
        run: ./scripts/make-app.sh

      # Static, before launch: every @rpath dependency must resolve inside the
      # bundle or against its LC_RPATHs (the v0.3.0 crash class).
      - name: Bundle dylib resolution (every @rpath dep must resolve)
        run: bash scripts/mac-check-dylibs.sh dist/Suramak.app

      - name: Smoke test the bundle
        run: SURAMAK_SMOKE_SECS=3 ./dist/Suramak.app/Contents/MacOS/suramak

      # M2: the scripted in-app job on the real (Metal/Core ML) build — import →
      # transcribe → sqlite library → DB assertion → SMOKE-JOB-OK.
      - name: UI scripted smoke job (in-app pipeline → sqlite library)
        env:
          # CI-smoke diagnostics (branch ci/smoke-diagnostics): verbose app logs
          # to pinpoint where the runner hangs.
          RUST_LOG: debug
        run: |
          rm -f build/smoke_job_ok.txt
          SURAMAK_SMOKE_SECS=120 SURAMAK_SMOKE_JOB=fixtures/audio/en.wav ./dist/Suramak.app/Contents/MacOS/suramak &
          PID=$!
          for i in $(seq 1 30); do kill -0 $PID 2>/dev/null || break; sleep 5; done
          if kill -0 $PID 2>/dev/null; then
            echo "smoke job app still alive after 150s — capturing a hang sample (M12 CI forensics)"
            sample $PID 2 -file build/mac-smoke-hang.txt 2>&1 | tail -3 || true
            echo "===== hang sample (top of all threads, first 120 lines) ====="
            head -120 build/mac-smoke-hang.txt 2>/dev/null || true
            echo "===== end hang sample ====="
            kill -9 $PID 2>/dev/null || true
          fi
          wait $PID 2>/dev/null; echo "smoke job app exit=$?"
          test -f build/smoke_job_ok.txt && echo SMOKE-JOB-OK
          ./target/release/suramak-cli library list | grep -q "en.wav" && echo LIBRARY-OK

      - name: Upload Suramak.app
        uses: actions/upload-artifact@v4
        with:
          name: Suramak.app
          path: dist/Suramak.app
          if-no-files-found: error

  # M13a: the engine stack cross-compiles for Android — arm64-v8a (release, the
  # shipping ABI) + x86_64 (debug, the emulator ABI) — through the same script
  # CI and humans run (`scripts/android/build.sh`). The NDK is pinned to r27d
  # (27.3.13750724), sha256-verified before unpacking and cached keyed on that
  # revision; cargo-ndk is pinned to 4.1.2. Pins + rationale: docs/android.md.
  # This job proves compile+link only — runtime behaviour is the M13b gates
  # (emulator smoke, owner device).
  android-build:
    name: android-build (NDK r27d, arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (cmake for whisper.cpp)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Add Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk (pinned 4.1.2)
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Restore the pinned NDK (r27d)
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-ndk/android-ndk-r27d
          key: android-ndk-r27d-27.3.13750724

      - name: Download the pinned NDK (r27d) — sha256 verified
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-ndk"
          curl -fL --retry 3 -o "$RUNNER_TEMP/android-ndk-r27d-linux.zip" \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          echo "601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9  $RUNNER_TEMP/android-ndk-r27d-linux.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-ndk-r27d-linux.zip" -d "$HOME/android-ndk"
          rm "$RUNNER_TEMP/android-ndk-r27d-linux.zip"

      # `bash` (not a bare `./scripts/...` path) so the job never depends on the
      # committed exec bit surviving; the script is +x on disk either way.
      - name: Cross-build both ABIs (scripts/android/build.sh)
        run: bash scripts/android/build.sh

  # M14a: Windows bring-up — the workspace compiles, tests and transcribes on a
  # native MSVC build (x86_64-pc-windows-msvc) on the pinned `windows-2022`
  # image (D4: never `windows-latest`; the pin is validated by the first push).
  # Scope is the shared crates + the CLI — the GUI is later slices (M14b+), so
  # there is no `suramak.exe` here and no GUI smoke.
  #
  # Build settings that live outside the Rust source (all D4):
  #  * Static CRT. `.cargo/config.toml` carries `-C target-feature=+crt-static`
  #    for this target; the CMake-built C deps are steered by the env below —
  #    `CMAKE_MSVC_RUNTIME_LIBRARY` (whisper.cpp/ggml),
  #    `CMAKE_POLICY_DEFAULT_CMP0091=NEW` (whisper.cpp's
  #    cmake_minimum_required(3.5) predates CMP0091, the policy that owns that
  #    switch) and `CMAKE_TOOLCHAIN_FILE` ->
  #    `scripts/windows/msvc-static-crt.cmake` (libopus's own
  #    OPUS_STATIC_RUNTIME knob; opusic-sys forwards no CMAKE_* env).
  #    `cc`-built C deps (SQLite, ring) follow the crt-static target feature
  #    automatically. The `dumpbin` step below fails the job if any
  #    VCRUNTIME/MSVCP import survives.
  #  * Portable CPU baseline: `GGML_NATIVE=OFF` (no build-host tuning) with an
  #    explicit `GGML_AVX2=ON` x86-64 level; ggml keeps its runtime dispatch for
  #    the AVX/SSE tiers below AVX2.
  # `cargo check -p suramak-asr --features parakeet` is a compile check only —
  # Parakeet is not packaged on Windows (D4 / plan §4).
  windows:
    name: windows (windows-2022, MSVC)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # whisper sessions are not concurrency-safe in-process (see the linux job)
      RUST_TEST_THREADS: "1"
      CMAKE_POLICY_DEFAULT_CMP0091: NEW
      CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/scripts/windows/msvc-static-crt.cmake
      GGML_NATIVE: "OFF"
      GGML_AVX2: "ON"
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `suramak-taps` is macOS-only and compiles its no-op stub here; the
      # Sparkle (`updates`) and SpeechTranscriber features are off — the
      # exclusions are by cfg, not by test filters. These five packages are the
      # platform-neutral test surface (the workspace crates they pull in come
      # along).
      - name: Tests (core, asr, cli, playback, ui)
        # suramak-ui is included on purpose: its cfg(windows) guard tests
        # (instance_windows: ERROR_ALREADY_EXISTS path, event round-trip) and
        # the %LOCALAPPDATA% path rule only execute on this target.
        run: cargo test -p suramak-core -p suramak-asr -p suramak-cli -p suramak-playback -p suramak-ui

      - name: Parakeet feature — compile check only (not packaged on Windows)
        run: cargo check -p suramak-asr --features parakeet

      - name: Build release CLI (static CRT)
        run: cargo build --release -p suramak-cli

      # M14b's real proof: this is the only step that compiles the .rc via
      # rc.exe, embeds the manifest/icon/VERSIONINFO and LINKS the GUI binary
      # (clippy only checks it). The two assertions then verify the results:
      # the exe must be a GUI-subsystem binary (windows_subsystem attribute) and
      # must carry the VERSIONINFO from packaging/windows/suramak.rc.
      - name: Build release GUI (resources + link) and verify subsystem/version
        shell: pwsh
        run: |
          cargo build --release -p suramak-ui
          if ($LASTEXITCODE -ne 0) { throw "release GUI build failed" }
          # The crate is suramak-ui but its [[bin]] is named `suramak`
          # (packaging/Info.plist CFBundleExecutable agrees) — the exe is
          # suramak.exe, not suramak-ui.exe.
          $exe = ".\target\release\suramak.exe"
          if (-not (Test-Path $exe)) { throw "suramak.exe was not produced" }
          $dumpbin = Get-ChildItem -Path "${env:ProgramFiles}\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found — cannot verify the GUI binary" }
          $headers = & $dumpbin.FullName /headers $exe
          # The PE headers carry several lines containing "subsystem" (e.g.
          # "6.00 subsystem version"); the one that matters is the `Subsystem`
          # field whose value reads "(Windows GUI)" or "(Windows CUI)".
          $gui = ($headers | Select-String -Pattern '\(Windows GUI\)').Line
          $cui = ($headers | Select-String -Pattern '\(Windows CUI\)').Line
          Write-Host "subsystem evidence: GUI=[$gui] CUI=[$cui]"
          if (-not $gui -or $cui) {
            throw "expected a Windows GUI subsystem binary (windows_subsystem attribute), got GUI=[$gui] CUI=[$cui]"
          }
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "FileVersion=$($vi.FileVersion) ProductVersion=$($vi.ProductVersion)"
          if ([string]::IsNullOrWhiteSpace($vi.FileVersion)) { throw "no VERSIONINFO in suramak-ui.exe — the rc.exe resource step did not embed packaging/windows/suramak.rc" }
          Write-Host "GUI-OK: windows subsystem + version resource present"

      # D4's enforcement: the artifact must import no VC++ runtime DLL.
      - name: CRT check — dumpbin /dependents must show no VCRUNTIME/MSVCP
        shell: pwsh
        run: |
          # `build/` is gitignored — a fresh checkout has no such directory.
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $dumpbin = Get-ChildItem -Path "${env:ProgramFiles}\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found under Program Files — unexpected for the pinned windows-2022 image" }
          & $dumpbin.FullName /dependents .\target\release\suramak-cli.exe | Tee-Object -FilePath build\dumpbin-dependents.txt
          $imports = Get-Content build\dumpbin-dependents.txt -Raw
          if ($imports -match '(?im)^\s*(vcruntime|msvcp)') {
            throw "dynamic VC++ runtime import found in suramak-cli.exe — the static CRT (D4) is broken"
          }
          Write-Host "CRT-OK: no VCRUNTIME/MSVCP imports"

      - name: doctor
        run: .\target\release\suramak-cli.exe doctor

      - name: Restore tiny model cache
        uses: actions/cache@v4
        with:
          # M14b moved the Windows data dir to %LOCALAPPDATA%\Suramak (the app's
          # paths::platform_data_dir); models live directly under it.
          path: ~\AppData\Local\Suramak\models
          key: suramak-windows-models-tiny-be07e048e1e5

      - name: Download tiny model (sha256 verified)
        run: .\target\release\suramak-cli.exe models download tiny

      - name: CLI e2e — English fixture
        shell: pwsh
        run: |
          .\target\release\suramak-cli.exe transcribe fixtures/audio/en.wav --model tiny --lang en --formats json,md --out-dir build/out
          $d = Get-Content build/out/en.json -Raw | ConvertFrom-Json
          if (@($d.segments).Count -lt 1) { throw "no segments in build/out/en.json" }
          Write-Host "en segments: $(@($d.segments).Count)"
          if (-not (Select-String -Path build/out/en.json -Pattern 'fox' -Quiet)) { throw "expected 'fox' in the English transcript" }
          Write-Host "EN-OK"

      - name: CLI e2e — Indonesian fixture
        shell: pwsh
        run: |
          .\target\release\suramak-cli.exe transcribe fixtures/audio/id.wav --model tiny --lang id --formats json --out-dir build/out
          $d = Get-Content build/out/id.json -Raw | ConvertFrom-Json
          if (@($d.segments).Count -lt 1 -or [string]::IsNullOrWhiteSpace($d.segments[0].text)) { throw "no text in build/out/id.json" }
          Write-Host "id segments: $(@($d.segments).Count)"

      - name: Upload suramak-cli.exe (+ CRT evidence)
        uses: actions/upload-artifact@v4
        with:
          name: suramak-cli-windows-x86_64
          path: |
            target/release/suramak-cli.exe
            build/dumpbin-dependents.txt
          if-no-files-found: error

      # The GUI binary itself — this is what the owner's first-launch checklist
      # (docs/reports/M14b.md §6) runs. Built by the step above.
      - name: Upload suramak.exe (the GUI binary)
        uses: actions/upload-artifact@v4
        with:
          name: suramak-gui-windows-x86_64
          path: target/release/suramak.exe
          if-no-files-found: error

  # M13b: the Android shell spike (GameActivity + egui/wgpu). Builds the
  # installable debug APK for arm64-v8a through the same script a human runs
  # (`scripts/android/build-apk.sh`) and uploads it. Toolchain: JDK 17, NDK
  # r27d (same cache key as `android-build`), SDK platform 35 + build-tools
  # 35.0.0, cargo-ndk 4.1.2, Gradle 8.9 / AGP 8.7.3 / Kotlin 2.0.21 (the
  # wrapper and versions live in `android/`, see docs/reports/M13b.md).
  #
  # CI proves the APK builds, contains lib/arm64-v8a/libsuramak_android_spike.so
  # and carries the right package/minSdk/launchable activity. The four Go/No-Go
  # checks run on the owner's phone — no Android device exists on the runner.
  android-spike:
    name: android-spike (debug APK, arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: android-spike

      - name: Add the Android target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk (pinned 4.1.2)
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Restore the pinned NDK (r27d)
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/android-ndk/android-ndk-r27d
          key: android-ndk-r27d-27.3.13750724

      - name: Download the pinned NDK (r27d) — sha256 verified
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/android-ndk"
          curl -fL --retry 3 -o "$RUNNER_TEMP/android-ndk-r27d-linux.zip" \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          echo "601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9  $RUNNER_TEMP/android-ndk-r27d-linux.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/android-ndk-r27d-linux.zip" -d "$HOME/android-ndk"
          rm "$RUNNER_TEMP/android-ndk-r27d-linux.zip"

      - name: Install the SDK packages (platform-tools, android-35, build-tools 35.0.0)
        run: |
          set -euo pipefail
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build the debug APK (scripts/android/build-apk.sh)
        run: bash scripts/android/build-apk.sh

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: suramak-android-spike-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
