name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-app:
    name: macOS app bundle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        # M10B: SpeechTranscriber is compiled into the macOS artifact (behind
        # the default-OFF "Fast engine" setting). Swift bridge = Xcode on the
        # runner; no extra runtime dylibs (the Speech framework is OS-side).
        run: cargo build --release -p suramak-ui -p suramak-cli --features suramak-ui/speech-transcriber,suramak-cli/speech-transcriber

      - name: Fetch the pinned Sparkle distribution (framework + tools)
        # M12: the in-app updater's framework — one pinned, sha256-verified
        # download (scripts/fetch-sparkle.sh); the appcast step below reuses it.
        run: ./scripts/fetch-sparkle.sh

      - name: Bundle + ad-hoc sign (includes the generated app icon; embeds Sparkle for the updater)
        # M12: SURAMAK_FEATURES adds the `updates` feature to the bundled UI
        # build (and keeps M10B's speech-transcriber, which the step above
        # compiled in — the make-app.sh build is the one that ships).
        env:
          SURAMAK_FEATURES: speech-transcriber,updates
        run: ./scripts/make-app.sh

      # Hard gate before packaging: a bundle whose @rpath dependency cannot
      # resolve aborts at launch (v0.3.0 shipped exactly that — missing
      # libswift_Concurrency). Never publish a bundle this check rejects.
      - name: Bundle dylib resolution (every @rpath dep must resolve)
        run: bash scripts/mac-check-dylibs.sh dist/Suramak.app

      - name: Package (zip + plain dmg with an /Applications drag target)
        run: |
          TAG="${GITHUB_REF_NAME}"
          ditto -c -k --keepParent dist/Suramak.app "Suramak-${TAG}-macos-arm64.zip"
          mkdir -p dmg-staging
          ditto dist/Suramak.app "dmg-staging/Suramak.app"
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Suramak ${TAG}" -srcfolder dmg-staging -ov -format UDZO "Suramak-${TAG}-macos-arm64.dmg"

      - name: Appcast — sign the archive + write appcast.xml (skipped loudly without SPARKLE_ED_KEY)
        # M12: generate_appcast over a staging dir with the archive + the
        # CHANGELOG section as a same-named .md (release notes), EdDSA-signed
        # via `--ed-key-file -` from the SPARKLE_ED_KEY secret, download URLs
        # pinned to this tag's release assets, delta updates from the previous
        # releases' archives. No secret → a loud warning, no appcast, no failure.
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: ./scripts/make-appcast.sh "${GITHUB_REF_NAME}" "Suramak-${GITHUB_REF_NAME}-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            Suramak-*.zip
            Suramak-*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: appcast
          # M12: empty when the SPARKLE_ED_KEY secret is absent (the loud skip
          # above) — never a failure.
          if-no-files-found: ignore
          path: |
            build/appcast/appcast.xml
            build/appcast/*.delta

  linux-app:
    name: Linux app (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (cmake for whisper.cpp; libasound2-dev kept for the future Linux capture feature)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build (app + CLI)
        run: cargo build --release -p suramak-ui -p suramak-cli

      - name: Package (app binary + CLI + .desktop + icon)
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="suramak-${TAG}-linux-x86_64"
          mkdir -p "pkg/${DIR}"
          cp target/release/suramak target/release/suramak-cli "pkg/${DIR}/"
          cp assets/logo/icons/linux/suramak-256.png "pkg/${DIR}/suramak.png"
          cp README.md LICENSE "pkg/${DIR}/"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=Suramak' \
            'Comment=Private, on-device transcription' \
            'Exec=suramak' \
            'Icon=suramak' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=AudioVideo;Audio;Utility;' \
            > "pkg/${DIR}/suramak.desktop"
          tar -czf "${DIR}.tar.gz" -C pkg "${DIR}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: suramak-*-linux-x86_64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [macos-app, linux-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" 'BEGIN{f=0} $0 ~ "^## \\[" ver "\\]" {f=1; next} /^## \[/ {if (f) exit} f {print}' CHANGELOG.md > RELEASE-NOTES.md
          if [ ! -s RELEASE-NOTES.md ]; then echo "See CHANGELOG.md." > RELEASE-NOTES.md; fi
          {
            echo
            echo "---"
            echo "Ad-hoc signed build: on first launch macOS may ask you to right-click → Open (Gatekeeper)."
            echo "Models are not bundled — they download on first use (sha256-pinned)."
            echo "Linux: extract the tarball and run ./suramak — needs a Vulkan or OpenGL capable desktop; suramak.desktop + icon are included for your app menu."
            echo "Owner checklist for this machine: docs/USER_SMOKE.md"
          } >> RELEASE-NOTES.md

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # M12: appcast.xml (the Sparkle feed, EdDSA-signed) + any delta
          # updates ride along with the app archives; both come from the
          # macOS job's `appcast` artifact and are simply absent when the
          # SPARKLE_ED_KEY secret is not configured.
          files: |
            Suramak-*.zip
            Suramak-*.dmg
            suramak-*-linux-x86_64.tar.gz
            appcast.xml
            *.delta
          body_path: RELEASE-NOTES.md
