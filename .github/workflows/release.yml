name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  macos-app:
    name: macOS app bundle
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        # M10B: SpeechTranscriber is compiled into the macOS artifact (behind
        # the default-OFF "Fast engine" setting). Swift bridge = Xcode on the
        # runner; no extra runtime dylibs (the Speech framework is OS-side).
        # M16F: Parakeet/sherpa-onnx is compiled in too (still behind the same
        # default-OFF setting); its dylibs are embedded by make-app.sh below.
        run: cargo build --release -p suramak-ui -p suramak-cli --features suramak-ui/speech-transcriber,suramak-cli/speech-transcriber,suramak-ui/parakeet,suramak-cli/parakeet

      - name: Fetch the pinned Sparkle distribution (framework + tools)
        # M12: the in-app updater's framework — one pinned, sha256-verified
        # download (scripts/fetch-sparkle.sh); the appcast step below reuses it.
        run: ./scripts/fetch-sparkle.sh

      - name: Bundle + ad-hoc sign (includes the generated app icon; embeds Sparkle for the updater)
        # M12: SURAMAK_FEATURES adds the `updates` feature to the bundled UI
        # build (and keeps M10B's speech-transcriber, which the step above
        # compiled in — the make-app.sh build is the one that ships).
        # M16F: `parakeet` makes make-app.sh verify packaging/sherpa-dylibs.tsv,
        # embed the sherpa-onnx dylibs in Contents/Frameworks and ship the
        # third-party notices; the setting stays default-OFF.
        env:
          SURAMAK_FEATURES: speech-transcriber,updates,parakeet
        run: ./scripts/make-app.sh

      # Hard gate before packaging: a bundle whose @rpath dependency cannot
      # resolve aborts at launch (v0.3.0 shipped exactly that — missing
      # libswift_Concurrency). Never publish a bundle this check rejects.
      # M16F: SURAMAK_EXPECT_PARAKEET makes the sherpa chain mandatory, so a
      # feature that silently fell out of the build cannot pass as "nothing to
      # check".
      - name: Bundle dylib resolution (every @rpath dep must resolve)
        env:
          SURAMAK_EXPECT_PARAKEET: "1"
        run: bash scripts/mac-check-dylibs.sh dist/Suramak.app

      # M16F: the gate must be load-bearing. Hide each bundled sherpa dylib in
      # turn, require a failure, restore; then re-require a pass.
      - name: Bundle dylib gate — negative test (a missing sherpa dylib must fail)
        run: bash scripts/mac-check-dylibs-test.sh dist/Suramak.app

      # M16F: dynamic-load from a copied bundle with a scrubbed environment —
      # dyld must load both sherpa dylibs from Contents/Frameworks, never from
      # ~/.cargo or the sherpa-rs cache.
      - name: Parakeet dynamic-load smoke (clean env, copied bundle)
        run: bash scripts/mac-smoke-parakeet.sh dist/Suramak.app

      - name: Package (zip + plain dmg with an /Applications drag target)
        run: |
          TAG="${GITHUB_REF_NAME}"
          ditto -c -k --keepParent dist/Suramak.app "Suramak-${TAG}-macos-arm64.zip"
          mkdir -p dmg-staging
          ditto dist/Suramak.app "dmg-staging/Suramak.app"
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Suramak ${TAG}" -srcfolder dmg-staging -ov -format UDZO "Suramak-${TAG}-macos-arm64.dmg"

      - name: Appcast — sign the archive + write appcast.xml (skipped loudly without SPARKLE_ED_KEY)
        # M12: generate_appcast over a staging dir with the archive + the
        # CHANGELOG section as a same-named .md (release notes), EdDSA-signed
        # via `--ed-key-file -` from the SPARKLE_ED_KEY secret, download URLs
        # pinned to this tag's release assets, delta updates from the previous
        # releases' archives. No secret → a loud warning, no appcast, no failure.
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: ./scripts/make-appcast.sh "${GITHUB_REF_NAME}" "Suramak-${GITHUB_REF_NAME}-macos-arm64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: |
            Suramak-*.zip
            Suramak-*.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: appcast
          # M12: empty when the SPARKLE_ED_KEY secret is absent (the loud skip
          # above) — never a failure.
          if-no-files-found: ignore
          path: |
            build/appcast/appcast.xml
            build/appcast/*.delta

  linux-app:
    name: Linux app (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies (cmake for whisper.cpp; libasound2-dev kept for the future Linux capture feature)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build (app + CLI)
        run: cargo build --release -p suramak-ui -p suramak-cli

      - name: Package (app binary + CLI + .desktop + icon)
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="suramak-${TAG}-linux-x86_64"
          mkdir -p "pkg/${DIR}"
          cp target/release/suramak target/release/suramak-cli "pkg/${DIR}/"
          cp assets/logo/icons/linux/suramak-256.png "pkg/${DIR}/suramak.png"
          cp README.md LICENSE "pkg/${DIR}/"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=Suramak' \
            'Comment=Private, on-device transcription' \
            'Exec=suramak' \
            'Icon=suramak' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=AudioVideo;Audio;Utility;' \
            > "pkg/${DIR}/suramak.desktop"
          tar -czf "${DIR}.tar.gz" -C pkg "${DIR}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-app
          path: suramak-*-linux-x86_64.tar.gz

  android-app:
    name: Android app (signed APK, arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17 (javac required for Kotlin)
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac)))) >> $GITHUB_ENV

      - name: Android SDK + NDK r27d (sha256-pinned)
        run: |
          echo JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac)))) >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          sudo apt-get install -y ninja-build
          curl -sSLf -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          echo "601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9  /tmp/ndk.zip" | sha256sum -c
          unzip -q /tmp/ndk.zip -d /tmp
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-r27d" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/tmp/android-ndk-r27d" >> $GITHUB_ENV

      - name: Release keystore (from repo secrets; bytes never committed)
        run: |
          set -euo pipefail
          : "${SURAMAK_ANDROID_KEYSTORE_B64:?SURAMAK_ANDROID_KEYSTORE_B64 secret is required for an Android release}"
          : "${SURAMAK_ANDROID_KEYSTORE_PASS:?SURAMAK_ANDROID_KEYSTORE_PASS secret is required for an Android release}"
          echo "$SURAMAK_ANDROID_KEYSTORE_B64" | base64 -d > /home/runner/keys/suramak-release.keystore || {
            mkdir -p /home/runner/keys; echo "$SURAMAK_ANDROID_KEYSTORE_B64" | base64 -d > /home/runner/keys/suramak-release.keystore; }
          echo "SURAMAK_KEYSTORE=/home/runner/keys/suramak-release.keystore" >> $GITHUB_ENV
          echo "SURAMAK_KEYSTORE_PASS=$SURAMAK_ANDROID_KEYSTORE_PASS" >> $GITHUB_ENV
        env:
          SURAMAK_ANDROID_KEYSTORE_B64: ${{ secrets.SURAMAK_ANDROID_KEYSTORE_B64 }}
          SURAMAK_ANDROID_KEYSTORE_PASS: ${{ secrets.SURAMAK_ANDROID_KEYSTORE_PASS }}

      - name: Rust cache (android targets)
        uses: Swatinem/rust-cache@v2

      - name: Android toolchain (cargo-ndk 4.1.2 + rustup targets)
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Build the release APK (scripts/android/build-apk.sh, release mode)
        env:
          SURAMAK_ANDROID_RELEASE: "1"
        run: bash scripts/android/build-apk.sh

      - name: Sign (apksigner, v2 scheme)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          OUT="suramak-${TAG}-android-arm64-v8a.apk"
          cp "$UNSIGNED" "$OUT"
          # r27d's NDK does not ship apksigner; it lives in the SDK's
          # build-tools (preinstalled on the runner). Latest version wins.
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)apksigner"
          [ -x "$APKSIGNER" ] || fail "no apksigner under $ANDROID_HOME/build-tools"
          "$APKSIGNER" sign \
            --ks "$SURAMAK_KEYSTORE" --ks-key-alias suramak \
            --ks-pass "pass:$SURAMAK_KEYSTORE_PASS" --key-pass "pass:$SURAMAK_KEYSTORE_PASS" \
            --out "$OUT" "$OUT"
          "$APKSIGNER" verify --print-certs "$OUT"
          sha256sum "$OUT" > "${OUT}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: android-app
          path: |
            suramak-*-android-arm64-v8a.apk
            suramak-*-android-arm64-v8a.apk.sha256

  # M14X: Windows joins the release page. Shape mirrors `linux-app`; the env
  # block is the ci.yml `windows` job's, copied verbatim so the static-CRT /
  # portable-ggml settings have one source of truth (that job's comment owns
  # the why for each variable). Build only — no installer and no signing: the
  # zip is the shipped form, and the SmartScreen note is explained in the
  # release notes. The decision is recorded in
  # docs/reports/M14x-windows-release.md.
  windows-app:
    name: Windows app (zip, x86_64)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      # whisper sessions are not concurrency-safe in-process (see the linux job)
      RUST_TEST_THREADS: "1"
      CMAKE_POLICY_DEFAULT_CMP0091: NEW
      CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/scripts/windows/msvc-static-crt.cmake
      GGML_NATIVE: "OFF"
      GGML_AVX2: "ON"
    steps:
      - uses: actions/checkout@v7

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release

      # The same binaries the CI windows job builds: `suramak.exe` is the GUI
      # (the [[bin]] name of suramak-ui), `suramak-cli.exe` the console CLI.
      # No macOS-only features; Parakeet is not packaged on Windows (D4).
      - name: Build release binaries (static CRT)
        run: cargo build --release -p suramak-ui -p suramak-cli

      - name: Package suramak-<tag>-windows-x86_64.zip + .sha256
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag  = $env:GITHUB_REF_NAME
          $name = "suramak-$tag-windows-x86_64"
          $stage = Join-Path "build/windows-pkg" $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          foreach ($exe in @("suramak.exe", "suramak-cli.exe")) {
            $src = "target/release/$exe"
            if (-not (Test-Path $src)) { throw "$src was not produced by the release build" }
            Copy-Item $src (Join-Path $stage $exe)
          }
          foreach ($doc in @("LICENSE", "README.md")) {
            if (-not (Test-Path $doc)) { throw "$doc is missing from the checkout" }
            Copy-Item $doc (Join-Path $stage $doc)
          }

          $zip = "$name.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # Files at the archive root: extract → the two EXEs beside LICENSE
          # and README. Deflate is lossless, so the PE checks below run on the
          # exact bytes a user downloads.
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum(1) format with LF endings — `sha256sum -c` verifies it on
          # Linux/macOS, the same shape the Android APK ships.
          $sha = "$zip.sha256"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) $sha), "$hash  $zip`n")
          $recorded = ((Get-Content $sha -Raw) -split '\s+')[0]
          if ($recorded -ne $hash) { throw "sha256 file does not match $zip" }
          Write-Host "packaged $zip ($((Get-Item $zip).Length) bytes)"
          Write-Host "sha256 $hash"
          Get-ChildItem $stage | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      # The gate the CI windows job already enforces, moved onto the bytes that
      # will actually be downloaded: extract the zip, prove each EXE is
      # byte-identical to its build output, that suramak.exe is a GUI-subsystem
      # PE, and that neither EXE imports the dynamic VC++ runtime (D4).
      - name: Verify the packaged EXEs — PE headers (GUI subsystem, no dynamic CRT)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = "suramak-$env:GITHUB_REF_NAME-windows-x86_64.zip"
          $out = "build/windows-verify"
          if (Test-Path $out) { Remove-Item $out -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $out

          $dumpbin = Get-ChildItem -Path "${env:ProgramFiles}\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found under Program Files — unexpected for the pinned windows-2022 image" }

          foreach ($exe in @("suramak.exe", "suramak-cli.exe")) {
            $packaged = Join-Path $out $exe
            if (-not (Test-Path $packaged)) { throw "$exe is missing from the zip" }
            $inside = (Get-FileHash $packaged -Algorithm SHA256).Hash
            $built  = (Get-FileHash "target/release/$exe" -Algorithm SHA256).Hash
            if ($inside -ne $built) { throw "$exe inside the zip is not byte-identical to target/release/$exe" }

            $deps = & $dumpbin.FullName /dependents $packaged | Out-String
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /dependents failed on $exe" }
            Write-Host "--- $exe imports ---"
            Write-Host $deps
            if ($deps -match '(?im)^\s*(vcruntime|msvcp)') {
              throw "dynamic VC++ runtime import in packaged $exe — the static CRT (D4) is broken"
            }
          }

          $headers = & $dumpbin.FullName /headers (Join-Path $out "suramak.exe") | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dumpbin /headers failed on suramak.exe" }
          $gui = ($headers -split "`n" | Select-String -Pattern '\(Windows GUI\)').Line
          $cui = ($headers -split "`n" | Select-String -Pattern '\(Windows CUI\)').Line
          Write-Host "subsystem evidence: GUI=[$gui] CUI=[$cui]"
          if (-not $gui -or $cui) { throw "packaged suramak.exe is not a Windows GUI subsystem binary (GUI=[$gui] CUI=[$cui])" }

          # A console binary here proves the two EXEs were not swapped.
          $cliHeaders = & $dumpbin.FullName /headers (Join-Path $out "suramak-cli.exe") | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dumpbin /headers failed on suramak-cli.exe" }
          if ($cliHeaders -notmatch '\(Windows CUI\)') { throw "packaged suramak-cli.exe is not a console binary — wrong binary in the zip?" }
          Write-Host "PE-OK: suramak.exe (Windows GUI), suramak-cli.exe (Windows CUI), no VCRUNTIME/MSVCP imports"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-app
          path: |
            suramak-*-windows-x86_64.zip
            suramak-*-windows-x86_64.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [macos-app, linux-app, android-app, windows-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" 'BEGIN{f=0} $0 ~ "^## \\[" ver "\\]" {f=1; next} /^## \[/ {if (f) exit} f {print}' CHANGELOG.md > RELEASE-NOTES.md
          if [ ! -s RELEASE-NOTES.md ]; then echo "See CHANGELOG.md." > RELEASE-NOTES.md; fi
          {
            echo
            echo "---"
            echo "Ad-hoc signed build: on first launch macOS may ask you to right-click → Open (Gatekeeper)."
            echo "Models are not bundled — they download on first use (sha256-pinned)."
            echo "Linux: extract the tarball and run ./suramak — needs a Vulkan or OpenGL capable desktop; suramak.desktop + icon are included for your app menu."
            echo "Windows: extract the zip and run suramak.exe (suramak-cli.exe is the console CLI) — no installer; verify the download against the .sha256 file."
            echo "Windows may show a SmartScreen note on first launch — More info → Run anyway; the binary is bit-for-bit the CI build with a published sha256."
            echo "Android: install the arm64-v8a APK (Android 10+; the model downloads on first use)."
            echo "Owner checklist for this machine: docs/USER_SMOKE.md"
          } >> RELEASE-NOTES.md

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          # M12: appcast.xml (the Sparkle feed, EdDSA-signed) + any delta
          # updates ride along with the app archives; both come from the
          # macOS job's `appcast` artifact and are simply absent when the
          # SPARKLE_ED_KEY secret is not configured.
          files: |
            Suramak-*.zip
            Suramak-*.dmg
            suramak-*-linux-x86_64.tar.gz
            suramak-*-windows-x86_64.zip
            suramak-*-windows-x86_64.zip.sha256
            suramak-*-android-arm64-v8a.apk
            suramak-*-android-arm64-v8a.apk.sha256
            appcast.xml
            *.delta
          body_path: RELEASE-NOTES.md
