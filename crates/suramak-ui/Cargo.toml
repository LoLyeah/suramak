[package]
name = "suramak-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Suramak desktop app: winit + manual egui-winit/egui-wgpu wiring over the AppKit glass shell"

[[bin]]
name = "suramak"
path = "src/main.rs"

[dependencies]
suramak-core = { path = "../suramak-core" }
suramak-asr = { path = "../suramak-asr" }        # default features; `capture` OFF on Linux
suramak-glass = { path = "../suramak-glass" }
suramak-playback = { path = "../suramak-playback" }  # M8: cpal output engine + transport
# M16B: the Carbon global hotkey + chord grammar (pure Rust; `Unsupported` off
# macOS). No new external crates — the Carbon bindings are hand-written there.
suramak-taps = { path = "../suramak-taps" }
serde = { workspace = true }                     # M16B: HudSettings (hud.toml)
toml = { workspace = true }                      # M16B: hud.toml
uuid = { workspace = true }                      # transcript ids in Effect::DeleteTranscript (M4.5)
egui = { workspace = true }
egui-winit = { workspace = true }
egui-wgpu = { workspace = true }         # wgpu consumed via egui_wgpu::wgpu re-export only
winit = { workspace = true }
pollster = { workspace = true }          # block_on for surface creation
chrono = { workspace = true }            # `Recording <date>` titles (M3)
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# Native file dialogs for import (open) and export (save). macOS/Windows only:
# on Linux rfd would pull the zbus/xdg-portal dependency chain, and the path
# field affordance covers Linux (WORKORDER-M2 §5).
rfd = "0.15"
# M3: recording (cpal) + macOS system audio (suramak-taps) are compiled in on the
# desktop platforms only — Linux keeps a capture-free build (no ALSA runtime).
suramak-asr = { path = "../suramak-asr", features = ["capture"] }

[target.'cfg(target_os = "macos")'.dependencies]
# M12: the in-app updater — the `updates` feature turns it on.
# `sparkle-updater` 0.1.0 is objc2 bindings for Sparkle 2.9.6 (its build script
# needs SPARKLE_FRAMEWORK_PATH; `scripts/fetch-sparkle.sh` fetches the pinned
# distribution).
sparkle-updater = { version = "0.1.0", optional = true }
# M16B: objc2/AppKit are no longer feature-gated — the Compact HUD's panel
# surgery, Accessibility check, pasteboard write and CGEvent ⌘V need them in
# every macOS build. These crates were already macOS-only edges of the workspace
# (`suramak-glass` and the `updates` feature use them); this is not a new
# dependency, only a wider use of the same pinned versions.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",   # M16B: write the transcript we own
    "NSWorkspace",    # M16B: System Settings deep links
    "NSWindow",       # M16B: the HUD panel level / collection behaviour
] }

[target.'cfg(unix)'.dependencies]
# Single-instance guard (flock on the data-dir lock file, `src/instance.rs`).
# Unix-only; the Windows port will need its own mechanism (no-op stub for now).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# M14b (D2): `CreateMutexW` / `CreateEventW` / `OpenEventW` / `SetEvent` /
# `WaitForSingleObject` (single instance + activation), the process-token SID
# read (`OpenProcessToken` + `GetTokenInformation(TokenUser)`) and
# `AllowSetForegroundWindow`. Same major as `suramak-glass`'s DWM bindings, so the
# workspace resolves one `windows` crate.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# M14b: compiles `packaging/windows/suramak.rc` (icon + VERSIONINFO + application
# manifest) into the Windows binary, and no-ops on every other target — see
# `build.rs`.
embed-resource = "3"

[features]
# M10A: the Parakeet fast engine (forwards to suramak-asr's `parakeet` feature).
# OFF by default; the Settings "Fast engine (experimental)" toggle drives it.
parakeet = ["suramak-asr/parakeet"]
# M10B: Apple SpeechTranscriber (forwards to suramak-asr's `speech-transcriber`
# feature). OFF by default; macOS 26+ builds only (the `speech` crate is a Swift
# bridge). The Settings "Fast engine (experimental)" toggle drives it.
speech-transcriber = ["suramak-asr/speech-transcriber"]
# M12: in-app updates (Sparkle 2). OFF by default; macOS builds only. The build
# needs the pinned Sparkle distribution on disk (SPARKLE_FRAMEWORK_PATH —
# `scripts/fetch-sparkle.sh`), and the packaged app must embed Sparkle.framework
# + sign it (`scripts/make-app.sh` does both when SURAMAK_FEATURES contains
# `updates`). The "Automatic updates" setting and the "Check for Updates…" menu
# item are driven by src/updates.rs; without the feature the module is a stub.
updates = ["dep:sparkle-updater"]

[dev-dependencies]
# M11: the UI polish tests decode the `input_audio` base64 payload back to the
# WAV bytes and parse the recorded request bodies to verify what goes on the
# wire (production encoding lives in core).
base64 = { workspace = true }
serde_json = { workspace = true }
# M12: the packaging test verifies the cached Sparkle archive against the
# pinned sha256 when the fetch script has run (build/sparkle/…).
sha2 = { workspace = true }
