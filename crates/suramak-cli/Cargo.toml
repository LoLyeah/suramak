[package]
name = "suramak-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Suramak CLI — headless transcription, models, library, export, polish"
default-run = "suramak-cli"

[[bin]]
name = "suramak-cli"
path = "src/main.rs"

[dependencies]
suramak-core = { path = "../suramak-core" }
suramak-asr = { path = "../suramak-asr" }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[features]
# Forwards to suramak-asr's microphone-capture feature (used by `devices`).
capture = ["suramak-asr/capture"]
# M10A: the Parakeet fast engine (forwards to suramak-asr's `parakeet` feature).
# OFF by default; `transcribe --fast` / `settings.asr.fast_engine` drive it.
parakeet = ["suramak-asr/parakeet"]
