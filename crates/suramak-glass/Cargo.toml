[package]
name = "suramak-glass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "AppKit Liquid Glass integration (macOS), DWM backdrop stub (Windows), no-op (Linux)"

[dependencies]
winit = { workspace = true }             # Window type for apply(); never creates windows itself
raw-window-handle = { workspace = true } # ns_view / HWND extraction

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"                          # runtime Class::get + msg_send! for NSGlassEffectView
objc2-foundation = { version = "0.3.1", features = ["NSGeometry", "NSObject"] } # NSRect for setFrame:
objc2-app-kit = { version = "0.3.1", features = [
    "NSApplication",
    "NSAppearance",
    "NSColor",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSGlassEffectView", # typed wrapper (objc2-app-kit 0.3.2+, PLAN-NOTES §2); gated behind a runtime AnyClass check
    "NSGraphics",        # NSWindowOrderingMode — the float glass is ordered below the render surface (M8.5)
    "objc2-core-foundation", # CGFloat — the float glass's corner radius (M8.5)
] }

[target.'cfg(target_os = "windows")'.dependencies]
# Win32_UI_Controls carries `MARGINS` (used by `DwmExtendFrameIntoClientArea`);
# Win32_Graphics_Dwm the backdrop/dark-mode attributes (M4).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
