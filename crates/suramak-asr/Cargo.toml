[package]
name = "suramak-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Suramak ASR: whisper-rs pipeline, worker thread and microphone capture"

[dependencies]
suramak-core = { path = "../suramak-core" }
# `raw-api` re-exports whisper-rs-sys so the progress trampoline can name the C context
# types for `FullParams::set_progress_callback` + user-data pointer (PLAN §2).
whisper-rs = { workspace = true, features = ["raw-api"] }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Microphone capture (cpal). OFF by default so Linux builds never need ALSA headers.
# `suramak-taps` (macOS system audio, Addendum A) rides along with it.
capture = ["dep:cpal", "dep:suramak-taps"]
# Device-enumeration smoke test (open no stream; CI runners have no microphone).
# Implies `capture`. Used by the macOS CI job; compiles everywhere.
capture-test = ["capture"]
# Core ML (ANE) encoder support. Pure passthrough to whisper-rs; enabled for macOS
# targets below (see `[target.'cfg(target_os = "macos")'.dependencies]`), and available
# on every target so the CI cross-check can compile it explicitly.
coreml = ["whisper-rs/coreml"]
# M10A: the Parakeet fast engine (sherpa-rs / sherpa-onnx, Rust-native ONNX Runtime).
# OFF by default: builds without the feature are exactly as before (the engine is
# never routed to; `parakeet::compiled()` is false). `sherpa-rs/sys` exposes the raw
# C API, which the module uses for the token timestamps the safe wrapper drops.
parakeet = ["dep:sherpa-rs", "sherpa-rs/sys"]

[dependencies.cpal]
version = "0.15.3"
optional = true

# M10A: Rust bindings to sherpa-onnx (prebuilt native libraries via
# `download-binaries`; no cmake build of sherpa-onnx itself). The prebuilt
# libraries are fetched once at build time and cached under the user cache dir;
# on Linux the linked shared libraries are copied next to the test/binary in the
# cargo target dir, so runs need `LD_LIBRARY_PATH=<target>/<profile>` (documented
# in docs/ENGINES.md). macOS: the prebuilt universal2 libraries carry the Core ML
# execution provider; the module passes `provider=coreml` there.
[dependencies.sherpa-rs]
version = "0.6.8"
optional = true
default-features = false
features = ["download-binaries"]

[dependencies.suramak-taps]
# macOS system-audio taps; no-op stubs elsewhere (pure Rust).
path = "../suramak-taps"
optional = true

[target.'cfg(target_os = "macos")'.dependencies]
# macOS builds get the GPU tier (Metal) and the ANE tier (Core ML) — the Core ML encoder
# package is what makes whisper.cpp fast on Apple Silicon. `WHISPER_COREML_ALLOW_FALLBACK`
# is set by whisper-rs-sys, so a broken/missing encoder never breaks a run.
whisper-rs = { workspace = true, features = ["metal", "coreml"] }
