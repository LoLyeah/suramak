[package]
name = "suramak-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Suramak ASR: whisper-rs pipeline, worker thread and microphone capture"

[dependencies]
suramak-core = { path = "../suramak-core" }
# `raw-api` re-exports whisper-rs-sys so the progress trampoline can name the C context
# types for `FullParams::set_progress_callback` + user-data pointer (PLAN §2).
whisper-rs = { workspace = true, features = ["raw-api"] }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Microphone capture (cpal). OFF by default so Linux builds never need ALSA headers.
capture = ["dep:cpal"]
# Core ML (ANE) encoder support. Pure passthrough to whisper-rs; enabled for macOS
# targets below (see `[target.'cfg(target_os = "macos")'.dependencies]`), and available
# on every target so the CI cross-check can compile it explicitly.
coreml = ["whisper-rs/coreml"]

[dependencies.cpal]
version = "0.15.3"
optional = true

[target.'cfg(target_os = "macos")'.dependencies]
# macOS builds get the GPU tier (Metal) and the ANE tier (Core ML) — the Core ML encoder
# package is what makes whisper.cpp fast on Apple Silicon. `WHISPER_COREML_ALLOW_FALLBACK`
# is set by whisper-rs-sys, so a broken/missing encoder never breaks a run.
whisper-rs = { workspace = true, features = ["metal", "coreml"] }
