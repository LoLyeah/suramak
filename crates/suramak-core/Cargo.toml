[package]
name = "suramak-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
directories = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
symphonia = { workspace = true }
# M10C: Opus decoding (webm/opus, mkv-opus, raw Ogg-Opus) — bundled libopus via cc.
symphonia-adapter-libopus = { workspace = true }
rubato = { workspace = true }
hound = { workspace = true }
# Reads the official Core ML encoder packages (`.mlmodelc.zip`). Pure-Rust: default
# features are off (they would pull C-compiled bzip2/zstd/lzma) and only the deflate
# read path is enabled; flate2's backend is zlib-rs, a pure-Rust zlib (no C toolchain).
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
tempfile = "3"
