[package]
name = "suramak-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
directories = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
symphonia = { workspace = true }
# M10C: Opus decoding (webm/opus, mkv-opus, raw Ogg-Opus) — bundled libopus via cc.
symphonia-adapter-libopus = { workspace = true }
rubato = { workspace = true }
hound = { workspace = true }
base64 = { workspace = true }
# Reads the official Core ML encoder packages (`.mlmodelc.zip`). Pure-Rust: default
# features are off (they would pull C-compiled bzip2/zstd/lzma) and only the deflate
# read path is enabled; flate2's backend is zlib-rs, a pure-Rust zlib (no C toolchain).
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# M13d: `statvfs` for the free-space preflight. `libc` is already in the
# workspace graph on every target (ring/getrandom, chrono, sha2) and pinned in
# Cargo.lock — declaring it adds no package and no version.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# M13d thumb: the Windows free-space preflight needs GetDiskFreeSpaceExW.
# windows-sys 0.61 is already in the workspace lock (egui/winit bring it on
# windows targets); declaring it here adds no package and no version.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
tempfile = "3"
