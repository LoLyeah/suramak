[package]
name = "suramak-android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Suramak Android shell (M13a: cdylib smoke surface only; the app shell lands in M13b+)"

[lib]
# `cdylib` is the artifact Android loads (`libsuramak_android.so`). `rlib` is
# added so the host `cargo test` can link this crate and run its unit tests —
# a cdylib-only lib target cannot be tested directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
suramak-core = { path = "../suramak-core" }
suramak-asr = { path = "../suramak-asr" }
# M13g1: the shared Deck library (tokens, motion, compact profile). It has no
# winit/glass edges, so it compiles for Android unchanged — the point of the
# split.
suramak-ui = { path = "../suramak-ui" }
# M13d: the JSON command protocol between Kotlin and the model host. Already a
# workspace dependency of `suramak-core` — no new package.
serde_json = { workspace = true }
# M13e: the job journal's on-disk shape (derive only).
serde = { workspace = true }
# M13e: `uuid::Uuid::parse_str` for the notification's transcript id. Already in
# the lock and the graph through `suramak-core`; this is an edge, not a package.
uuid = { workspace = true }
# M19B: the compact host logs one model-truth marker per state change. `log`
# was already an Android-target dependency and the host tests run on the
# desktop, so the edge is target-independent (the same crate — no new package).
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
# M13d: the one JNI entry point. `jni` 0.21 is already in Cargo.lock and in the
# Android build graph (the M13b spike crate uses the same version), so this adds
# no package and no version bump.
jni = "0.21"
# M13F: the microphone. Enabling `suramak-asr/capture` only for the Android
# target turns on cpal's Oboe/AAudio backend (cpal 0.15.3 pulls `oboe 0.6`
# unconditionally on this target — no feature flip exists to make). Desktop
# builds keep the same feature set as before, so no ALSA requirement leaks in.
suramak-asr = { path = "../suramak-asr", features = ["capture"] }
# M13g3: the window and its lifecycle gates live in the M13b spike crate; the
# product surface and the one compact host live here. `android_main` in this
# crate's lib.rs passes the shell to `android_entry`, so the APK loads one
# library and there is one `CompactApp` behind both the window and the JNI
# bridge.
suramak-android-spike = { path = "../suramak-android-spike" }
android-activity = { version = "0.6.1", features = ["game-activity"] }
egui.workspace = true
ndk-context = "0.1"
