[workspace]
members = ["crates/suramak-core", "crates/suramak-asr", "crates/suramak-glass", "crates/suramak-taps", "crates/suramak-playback", "crates/suramak-ui", "crates/suramak-cli", "crates/suramak-android", "crates/suramak-android-spike"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
version = "0.3.0"

[profile.release]
lto = false

# Dependencies are ~2/3 of target/debug's size on the dev VPS. Line tables keep
# file:line in backtraces (drop variables/types); workspace crates keep full
# debug info. Verified against cargo profile docs; advised by glm-5.3.
[profile.dev.package."*"]
debug = "line-tables-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
# M5: `isomp4` decodes mp4/mov/m4v; `mkv` decodes matroska/webm containers (AAC
# inside mkv). `mkv` was already pulled in by symphonia's default features; it is
# listed explicitly so the intended reader set is pinned, not implied.
symphonia = { version = "0.5.4", features = ["aac", "flac", "isomp4", "mkv", "mp3", "vorbis", "wav"] }
# M10C: the Opus decoder symphonia 0.5 ships no first-party crate for (webm/opus,
# mkv-opus and raw Ogg-Opus voice notes). The adapter targets symphonia 0.5 — stay
# on the 0.2.x line (0.3.x targets symphonia 0.6). Default feature `bundled`
# compiles libopus (BSD) from source via `cc` — the whisper.cpp-class bundled-C
# pattern: no runtime library, nothing shipped separately. Do NOT enable
# symphonia's `opus` feature — 0.5.5 has no such feature (the upstream name is a
# no-op placeholder); this adapter is the decoder.
symphonia-adapter-libopus = "0.2"
rubato = { version = "0.16", features = ["fft_resampler"] }
hound = "3.5"
# M11: base64 for the audio-aware polish `input_audio` content parts (the WAV
# bytes go on the wire base64'd, per the OpenAI-compatible shape). Already in
# the lock via reqwest's transitive graph; pinned here directly.
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
pollster = "0.4"
egui = { version = "0.33", features = ["accesskit"] }
egui-winit = { version = "0.33", features = ["accesskit"] }
egui-wgpu = "0.33"
winit = { version = "0.30", features = ["rwh_06"] }
raw-window-handle = "0.6"
whisper-rs = "0.16"

# macOS 27: `-[NSView inputContext]` returns nil and winit 0.30.13 panics on the
# first text-field focus (`set_ime_cursor_area` → `.expect("input context")`).
# Upstream has no fix in the 0.30 line, so we pin our backport fork:
# github.com/LoLyeah/winit branch `suramak/macos27-ime-guard` — the IME extras
# degrade to no-ops and IME key interpretation is skipped when the context is
# nil (typing still works). Drop the pin when upstream handles the nil case.
# See docs/PLAN-NOTES.md.
[patch.crates-io]
winit = { git = "https://github.com/LoLyeah/winit", rev = "63f21f8e189d32852f0c0629f866e3292631371a" }
